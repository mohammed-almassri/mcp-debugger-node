name: Regenerate Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate-lockfile:
    name: Regenerate package-lock.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Regenerate lockfile
        run: |
          rm package-lock.json
          npm install --package-lock-only
          npm ci

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/regenerate-package-lock
          title: "chore: regenerate package lock on Linux"
          commit-message: "chore: regenerate package lock on Linux"
          body: "Regenerates package-lock.json on ubuntu-latest using Node 22.14.0."
